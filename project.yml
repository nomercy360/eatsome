name: Shaman

options:
  bundleIdPrefix: app.shaman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ShamanCore:
    path: Core

targets:
  Shaman:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ShamanCore
        product: ShamanCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Shaman
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          The camera counts your reps on-device. Video never leaves the phone
          and is never recorded.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of a meal to log it.
        NSHealthUpdateUsageDescription: >-
          Finished sets are written to Health so your rings and history stay in
          one place.
        NSHealthShareUsageDescription: >-
          Shaman does not read your health data; this key is required to write
          workouts.
    entitlements:
      path: App/Support/Shaman.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shaman.tracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple developer team here to run on a physical device.
        # The simulator does not need it.
        DEVELOPMENT_TEAM: ""
