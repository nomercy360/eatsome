name: eatsome

options:
  bundleIdPrefix: me.eatso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ShamanCore:
    path: Core

targets:
  eatsome:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ShamanCore
        product: ShamanCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: eatsome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Photograph meals so eatsome can identify their food groups.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of a meal to log it.
        NSHealthShareUsageDescription: >-
          Import workouts, sleep, and weight to show your daily health overview.
        # HTTPS only, which is exempt. Without this, App Store Connect asks the
        # export-compliance question on every single TestFlight build.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Support/eatsome.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        # Retained so the renamed app updates in place and keeps its sandbox.
        PRODUCT_BUNDLE_IDENTIFIER: app.shaman.tracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4HYA2TN65
