name: eatsome

options:
  bundleIdPrefix: co.eatsome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  EatsomeCore:
    path: Core

targets:
  eatsome:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # One package, one product. Two were linked while the app was moved over
      # screen by screen — a file imported one or the other, never both — and
      # ShamanCore went with the last view that imported it.
      - package: EatsomeCore
        product: EatsomeCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: eatsome
        # No `CFBundleURLTypes`. The `eatsome://` scheme existed for table
        # invites, and there are no tables — a registered scheme with nothing
        # behind it is a door into an app that cannot answer it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # The identity is Sora, so it ships with the app rather than being asked
        # for at runtime — a font fetched over the network is a first launch
        # that renders in the wrong typeface on a bad connection. OFL/SIL, and
        # the licence ships beside it as Sora-OFL.txt.
        #
        # Five static cuts rather than the upstream `Sora[wght].ttf`: iOS
        # registers a variable font at its default instance only, so a bundled
        # variable file would render every weight in the app at 400 while
        # `UIFont(name:)` still answered — the silent kind of wrong. They are
        # generated from the variable original with `scripts/build-fonts.py`.
        UIAppFonts:
          - Sora-Regular.ttf
          - Sora-Medium.ttf
          - Sora-SemiBold.ttf
          - Sora-Bold.ttf
          - Sora-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Photograph meals so eatsome can identify their food groups.
        NSPhotoLibraryUsageDescription: >-
          Show your latest photos in the meal logger so you can attach one quickly.
        # No `NSMicrophoneUsageDescription`. Dictation is gone; a purpose string
        # for a permission the app never asks for is a promise about a feature
        # that does not exist.
        NSHealthShareUsageDescription: >-
          Read age, sex reference, height, weight, body fat and energy to fill
          your daily energy and macro reference.
        # Demanded by App Store validation whenever the HealthKit entitlement is
        # present, even though nothing here writes. Says so plainly rather than
        # inventing a use.
        NSHealthUpdateUsageDescription: >-
          eatsome never writes to Health. It only reads your body profile and
          energy for a daily reference.
        # HTTPS only, which is exempt. Without this, App Store Connect asks the
        # export-compliance question on every single TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        EatsomeAPIBaseURL: https://eatsome-api.peatch.workers.dev/api/v1
    entitlements:
      path: App/Support/eatsome.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Sign in with Apple is the production account boundary and the first
        # screen after launch when no valid session is stored.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # Retained so the renamed app updates in place and keeps its sandbox.
        PRODUCT_BUNDLE_IDENTIFIER: app.shaman.tracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        # Without this there is no CFBundleIconName, and the upload is rejected
        # even when the asset catalog is present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4HYA2TN65
