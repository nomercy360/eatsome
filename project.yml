name: eatsome

options:
  bundleIdPrefix: me.eatso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ShamanCore:
    path: Core

targets:
  eatsome:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ShamanCore
        product: ShamanCore
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: eatsome
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # The identity is Space Grotesk, so it ships with the app rather than
        # being asked for at runtime — a font fetched over the network is a
        # first launch that renders in the wrong typeface on a bad connection.
        # Both faces are OFL/SIL licensed and the licences ship beside them.
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - IBMPlexMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Photograph meals so eatsome can identify their food groups.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of a meal to log it.
        NSMicrophoneUsageDescription: >-
          Describe a meal out loud instead of typing it. Audio is transcribed to
          text as you speak and is not kept.
        NSHealthShareUsageDescription: >-
          Import workouts, sleep, and weight to show your daily health overview.
        # Demanded by App Store validation whenever the HealthKit entitlement is
        # present, even though nothing here writes. Says so plainly rather than
        # inventing a use.
        NSHealthUpdateUsageDescription: >-
          eatsome never writes to Health. It only reads workouts, sleep, and
          weight to show your daily overview.
        # HTTPS only, which is exempt. Without this, App Store Connect asks the
        # export-compliance question on every single TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        EatsomeAPIBaseURL: https://eatsome-api.peatch.workers.dev/api/v1
        # Supplied as an xcodebuild setting by release-testflight.sh. It says
        # "this is the app", not "this is you": everyone on the build shares
        # this value, and production data routes additionally require the
        # Apple-backed session. App Attest can later replace the build token.
        EatsomeAPIToken: $(EATSOME_API_TOKEN)
    entitlements:
      path: App/Support/eatsome.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Sign in with Apple is the production account boundary and the first
        # screen after launch when no valid session is stored.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # Retained so the renamed app updates in place and keeps its sandbox.
        PRODUCT_BUNDLE_IDENTIFIER: app.shaman.tracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        # Without this there is no CFBundleIconName, and the upload is rejected
        # even when the asset catalog is present.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4HYA2TN65
